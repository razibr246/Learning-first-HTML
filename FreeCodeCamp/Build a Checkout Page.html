<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>
</head>
<body>

  <h1>Checkout</h1>

  <section>
    <h2>Your Cart</h2>

    <img 
      src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
      alt="Blue cube product image"
      width="200"
    >

    <p>Product: Blue Cube</p>
    <p>Price: $49.99</p>
  </section>

  <section>
    <h2>Payment Information</h2>

    <form>

      <label for="card-name">
        Card Name
        <span aria-hidden="true">*</span>
      </label>
      <input
        type="text"
        id="card-name"
        name="card-name"
        required
      >

      <br><br>

      <label for="card-number">
        Card Number
        <span aria-hidden="true">*</span>
      </label>
      <input
        type="text"
        id="card-number"
        name="card-number"
        required
        aria-describedby="card-number-help"
      >

      <p id="card-number-help">
        Enter your card number in the format: 1234 5678 9012 3456
      </p>

      <br>

      <input type="submit" value="Complete Purchase">

    </form>
  </section>

</body>
</html>
